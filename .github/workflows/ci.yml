name: CI

on:
  push:
    branches:
      - main
      - develop
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: PHP ${{ matrix.php }} Laravel ${{ matrix.laravel }} ${{ matrix.dependency-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        php:
          - '8.3'
          - '8.4'
          - '8.5'
        laravel:
          - '12'
          - '13'
        dependency-version:
          - lowest
          - stable
        include:
          - laravel: '12'
            testbench: '10'
          - laravel: '13'
            testbench: '11'
    steps:
      - name: Checkout
        # actions/checkout@v4.1.1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Setup PHP
        # shivammathur/setup-php@2.40.0
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          tools: composer:v2

      - name: Validate composer.json
        run: composer validate --strict --no-check-lock

      - name: Install dependencies
        run: |
          composer require --dev --no-interaction --no-update "orchestra/testbench:^${{ matrix.testbench }}.0"
          composer require --no-interaction --no-update \
            "illuminate/contracts:^${{ matrix.laravel }}.0" \
            "illuminate/http:^${{ matrix.laravel }}.0" \
            "illuminate/support:^${{ matrix.laravel }}.0"
          if [ "${{ matrix.dependency-version }}" = "lowest" ]; then
            composer update --no-interaction --prefer-dist --prefer-lowest --with-all-dependencies
          else
            composer update --no-interaction --prefer-dist --with-all-dependencies
          fi

      - name: Composer audit
        run: composer audit --no-interaction

      # Static analysis depends on the tool versions, not on the runtime floor:
      # with --prefer-lowest, old polyfills redefine core functions without types.
      - name: Pint
        if: matrix.dependency-version == 'stable'
        run: vendor/bin/pint --test

      - name: PHPStan
        if: matrix.dependency-version == 'stable'
        run: vendor/bin/phpstan analyse --memory-limit=1G --no-progress

      # Level max with no baseline: the ratchet fails if a baseline ever appears.
      - name: Larastan baseline only shrinks
        run: node scripts/qiick-ratchet.mjs phpstan --min-level max

      - name: Pest
        run: vendor/bin/pest

      # Mutation targets from the design §6 (honest score; no || true).
      - name: Pest mutate (security-critical classes)
        if: matrix.php == '8.4' && matrix.laravel == '12' && matrix.dependency-version == 'stable'
        run: |
          vendor/bin/pest --mutate --parallel --min=95 \
            --class='Qiick\\ApiKeys\\TokenCodec' \
            --class='Qiick\\ApiKeys\\Scope' \
            --class='Qiick\\ApiKeys\\ScopeSet' \
            --class='Qiick\\ApiKeys\\IpAllowlist' \
            --class='Qiick\\ApiKeys\\ApiKeyAuthenticator' \
            --class='Qiick\\ApiKeys\\Exceptions\\ApiKeyRejection' \
            --class='Qiick\\ApiKeys\\UsageRecorder' \
            --class='Qiick\\ApiKeys\\FailedAttemptLimiter' \
            --class='Qiick\\ApiKeys\\Http\\BearerTokenExtractor'

  # Adapter-example smoke once Eloquent examples land; scaffold keeps the job
  # so the matrix shape matches the design (SQLite / MySQL / MariaDB / PostgreSQL).
  databases:
    name: Databases smoke (${{ matrix.engine }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        engine:
          - sqlite
          - mysql
          - mariadb
          - pgsql
    steps:
      - name: Checkout
        # actions/checkout@v4.1.1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Setup PHP
        # shivammathur/setup-php@2.40.0
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962
        with:
          php-version: '8.4'
          coverage: none
          tools: composer:v2
          extensions: pdo_sqlite, pdo_mysql, pdo_pgsql

      - name: Install dependencies
        run: composer update --no-interaction --prefer-dist

      - name: Pest (no adapter examples yet)
        run: |
          echo "Engine=${{ matrix.engine }}: adapter examples land in a later PR."
          vendor/bin/pest

  # Prefer SHA pin when the reusable workflow is addressable; app-ui publishes
  # drift-check under tags, so @v0.11.0 matches qiick-standards.json "ref".
  standards:
    uses: qiick-io/app-ui/.github/workflows/drift-check.yml@v0.11.0
    with:
      standards: true
      registry: false
