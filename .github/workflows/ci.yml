name: CI

on:
  push:
    branches:
      - main
      - develop
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: PHP ${{ matrix.php }} Laravel ${{ matrix.laravel }} ${{ matrix.dependency-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        php:
          - '8.3'
          - '8.4'
          - '8.5'
        laravel:
          - '12'
          - '13'
        dependency-version:
          - lowest
          - stable
        include:
          - laravel: '12'
            testbench: '10'
          - laravel: '13'
            testbench: '11'
    steps:
      - name: Checkout
        # actions/checkout@v4.1.1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Setup PHP
        # shivammathur/setup-php@2.40.0
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962
        with:
          php-version: ${{ matrix.php }}
          # pcov required for the mutate cell (pest --mutate needs a coverage driver).
          coverage: ${{ (matrix.php == '8.4' && matrix.laravel == '12' && matrix.dependency-version == 'stable') && 'pcov' || 'none' }}
          tools: composer:v2

      - name: Validate composer.json
        run: composer validate --strict --no-check-lock

      - name: Install dependencies
        run: |
          composer require --dev --no-interaction --no-update "orchestra/testbench:^${{ matrix.testbench }}.0"
          composer require --no-interaction --no-update \
            "illuminate/console:^${{ matrix.laravel }}.0" \
            "illuminate/contracts:^${{ matrix.laravel }}.0" \
            "illuminate/http:^${{ matrix.laravel }}.0" \
            "illuminate/notifications:^${{ matrix.laravel }}.0" \
            "illuminate/support:^${{ matrix.laravel }}.0"
          if [ "${{ matrix.dependency-version }}" = "lowest" ]; then
            composer update --no-interaction --prefer-dist --prefer-lowest --with-all-dependencies
          else
            composer update --no-interaction --prefer-dist --with-all-dependencies
          fi

      - name: Composer audit
        run: composer audit --no-interaction

      # Static analysis depends on the tool versions, not on the runtime floor:
      # with --prefer-lowest, old polyfills redefine core functions without types.
      - name: Pint
        if: matrix.dependency-version == 'stable'
        run: vendor/bin/pint --test

      - name: PHPStan
        if: matrix.dependency-version == 'stable'
        run: vendor/bin/phpstan analyse --memory-limit=1G --no-progress

      # Level max with no baseline: the ratchet fails if a baseline ever appears.
      - name: Larastan baseline only shrinks
        run: node scripts/qiick-ratchet.mjs phpstan --min-level max

      - name: Pest
        run: vendor/bin/pest

      # Mutation targets from the design §6. Enforce >=95% per class (a combined
      # CSV can hide a weak class behind a high overall score).
      - name: Pest mutate (security-critical classes, per-class min 95)
        if: matrix.php == '8.4' && matrix.laravel == '12' && matrix.dependency-version == 'stable'
        run: bash scripts/mutate-per-class.sh

  # Expiry-notice claim CAS on SQLite / MySQL / MariaDB / PostgreSQL.
  # Services start only for the engine under test (docker in-step for cost).
  databases:
    name: Databases smoke (${{ matrix.engine }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        engine:
          - sqlite
          - mysql
          - mariadb
          - pgsql
    steps:
      - name: Checkout
        # actions/checkout@v4.1.1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Setup PHP
        # shivammathur/setup-php@2.40.0
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962
        with:
          php-version: '8.4'
          coverage: none
          tools: composer:v2
          extensions: pdo_sqlite, pdo_mysql, pdo_pgsql

      - name: Install dependencies
        run: composer update --no-interaction --prefer-dist

      - name: Start MySQL
        if: matrix.engine == 'mysql'
        run: |
          docker run -d --name claim-mysql \
            -e MYSQL_ROOT_PASSWORD=password \
            -e MYSQL_DATABASE=api_keys_claim \
            -p 3306:3306 \
            mysql:8.4
          for attempt in $(seq 1 30); do
            if docker exec claim-mysql mysqladmin ping -h 127.0.0.1 -uroot -ppassword --silent; then
              exit 0
            fi
            sleep 2
          done
          echo "MySQL did not become ready" >&2
          exit 1

      - name: Start MariaDB
        if: matrix.engine == 'mariadb'
        run: |
          docker run -d --name claim-mariadb \
            -e MARIADB_ROOT_PASSWORD=password \
            -e MARIADB_DATABASE=api_keys_claim \
            -p 3307:3306 \
            mariadb:11
          for attempt in $(seq 1 30); do
            if docker exec claim-mariadb mariadb-admin ping -h 127.0.0.1 -uroot -ppassword --silent; then
              exit 0
            fi
            sleep 2
          done
          echo "MariaDB did not become ready" >&2
          exit 1

      - name: Start PostgreSQL
        if: matrix.engine == 'pgsql'
        run: |
          docker run -d --name claim-pgsql \
            -e POSTGRES_PASSWORD=password \
            -e POSTGRES_DB=api_keys_claim \
            -p 5432:5432 \
            postgres:16
          for attempt in $(seq 1 30); do
            if docker exec claim-pgsql pg_isready -U postgres; then
              exit 0
            fi
            sleep 2
          done
          echo "PostgreSQL did not become ready" >&2
          exit 1

      - name: Expiry notice claim CAS (${{ matrix.engine }})
        env:
          API_KEYS_CLAIM_ENGINE: ${{ matrix.engine }}
          API_KEYS_CLAIM_PASSWORD: password
        run: vendor/bin/pest --filter=ExpiryNoticeClaimCas

  # Prefer SHA pin when the reusable workflow is addressable; app-ui publishes
  # drift-check under tags, so @v0.11.0 matches qiick-standards.json "ref".
  standards:
    uses: qiick-io/app-ui/.github/workflows/drift-check.yml@v0.11.0
    with:
      standards: true
      registry: false
