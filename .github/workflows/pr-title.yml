name: pr title

# PRs are squash-merged, so the title becomes the commit on develop: it must be
# a Conventional Commit. `edited` reruns the check when the title changes.

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  contents: read

jobs:
  pr-title:
    uses: qiick-io/app-ui/.github/workflows/pr-title.yml@v0.11.0
