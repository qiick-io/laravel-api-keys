name: pr title

# PRs are squash-merged, so the title becomes the commit on develop: it must be
# a Conventional Commit. `edited` reruns the check when the title changes.

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  pr-title:
    # qiick-io/app-ui v0.11.0
    uses: qiick-io/app-ui/.github/workflows/pr-title.yml@cbb1843eb1f50ef5a38e7e7bdf9b8dbec7b48bed
