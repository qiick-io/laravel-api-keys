name: Public Suffix List refresh

# Monthly: regenerate resources/public_suffix_list.php from publicsuffix.org and
# open a pull request against develop when it changed. A refresh can deny
# stored origin patterns that sit on a newly listed suffix, so every refresh
# goes through review and is named in the CHANGELOG.
#
# Pull requests opened with GITHUB_TOKEN do not trigger other workflows: push an
# empty commit (or close and reopen the PR) to run CI before merging. The repo
# setting "Allow GitHub Actions to create and approve pull requests" must be on.

on:
  schedule:
    - cron: '0 6 1 * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: public-suffix-list
  cancel-in-progress: false

jobs:
  refresh:
    name: Refresh the Public Suffix List snapshot
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        # actions/checkout@v4.1.1
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: develop

      - name: Setup PHP
        # shivammathur/setup-php@2.40.0
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962
        with:
          php-version: '8.4'
          coverage: none
          tools: composer:v2
          extensions: intl

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist

      - name: Regenerate the snapshot
        run: |
          php scripts/update-public-suffix-list.php
          vendor/bin/pint resources

      - name: Open a pull request when the rules changed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # The header carries the fetch date; only a change in the rules is worth a PR.
          if git diff --quiet -I '^// Fetched: ' -- resources/public_suffix_list.php; then
            echo "Public Suffix List unchanged."
            exit 0
          fi

          branch="chore/public-suffix-list-$(date -u +%Y-%m)"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git switch -c "$branch"
          git add resources/public_suffix_list.php
          git commit -m "chore(deps): refresh the public suffix list snapshot"
          git push origin "$branch"
          gh pr create --base develop --head "$branch" \
            --title "chore(deps): refresh the public suffix list snapshot" \
            --body "Monthly refresh of \`resources/public_suffix_list.php\` from https://publicsuffix.org/list/public_suffix_list.dat.

          Review before merging: a newly listed suffix makes stored origin wildcards over it (for example \`https://*.new-platform.example\`) parse as denied, so keys using them stop authenticating after the release. Name this refresh in the CHANGELOG.

          CI does not start on pull requests opened by GITHUB_TOKEN: push an empty commit or close and reopen this PR to run it."
